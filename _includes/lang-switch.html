<style>
  .lang-panel--en { display: none; }
  html.site-lang-en .lang-panel--zh { display: none; }
  html.site-lang-en .lang-panel--en { display: block; }
  .masthead__nav-item--en { display: none !important; }
  html.site-lang-en .masthead__nav-item--zh { display: none !important; }
  html.site-lang-en .visible-links > .masthead__nav-item--en {
    display: table-cell;
  }
  .greedy-nav .hidden-links .masthead__nav-item {
    display: block !important;
  }
  html.site-lang-en .author__bio--zh,
  html.site-lang-en .author__desc--zh { display: none; }
  html.site-lang-en .author__bio--en,
  html.site-lang-en .author__desc--en { display: block; }
  .author__bio--en,
  .author__desc--en { display: none; }
  .photos-page__back--en,
  .photos-page__empty--en,
  .photos-grid__caption--en { display: none; }
  html.site-lang-en .photos-page__back--zh,
  html.site-lang-en .photos-page__empty--zh,
  html.site-lang-en .photos-grid__caption--zh { display: none; }
  html.site-lang-en .photos-page__back--en,
  html.site-lang-en .photos-page__empty--en,
  html.site-lang-en .photos-grid__caption--en { display: block; }
  .masthead__lang-btn {
    background: none;
    border: none;
    padding: 0.35rem 0.25rem;
    font: inherit;
    font-size: inherit;
    font-weight: 600;
    cursor: pointer;
    color: #7a8288;
  }
  .masthead__lang-btn--active {
    color: #eeac00;
    cursor: default;
    pointer-events: none;
  }
</style>
<script>
  (function () {
    function setLang(lang) {
      var isEn = lang === "en";
      document.documentElement.classList.toggle("site-lang-en", isEn);
      document.documentElement.lang = isEn ? "en" : "zh-CN";

      document.querySelectorAll(".masthead__lang-btn").forEach(function (btn) {
        var active = btn.getAttribute("data-lang") === lang;
        btn.classList.toggle("masthead__lang-btn--active", active);
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      });

      try { localStorage.setItem("site-lang", lang); } catch (e) {}

      var url = new URL(window.location.href);
      if (isEn) { url.searchParams.set("lang", "en"); }
      else { url.searchParams.delete("lang"); }
      history.replaceState(null, "", url.pathname + url.search + url.hash);

      if (window.greedyNavRestore && window.greedyNavUpdate) {
        window.greedyNavRestore();
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            window.greedyNavUpdate();
          });
        });
      }
    }

    function syncLangFromHash() {
      var hash = window.location.hash;
      if (!hash) return;
      if (hash.indexOf("#en-") === 0 || hash === "#en-about-me") {
        setLang("en");
      } else {
        setLang("zh");
      }
    }

    document.addEventListener("click", function (e) {
      var btn = e.target.closest(".masthead__lang-btn");
      if (btn) {
        e.preventDefault();
        setLang(btn.getAttribute("data-lang"));
        return;
      }

      var navLink = e.target.closest(".masthead__nav a[href^='#']");
      if (!navLink) return;
      var navItem = navLink.closest(".masthead__nav-item");
      if (navItem && navItem.classList.contains("masthead__nav-item--en")) {
        setLang("en");
      } else if (navItem && navItem.classList.contains("masthead__nav-item--zh")) {
        setLang("zh");
      }
    }, true);

    window.addEventListener("hashchange", syncLangFromHash);

    var params = new URLSearchParams(window.location.search);
    var saved = "";
    try { saved = localStorage.getItem("site-lang") || ""; } catch (e) {}
    var initial = params.get("lang") === "en" || saved === "en" ? "en" : "zh";
    if (window.location.hash) {
      syncLangFromHash();
    } else {
      setLang(initial);
    }
  })();
</script>
