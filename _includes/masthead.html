<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links masthead__nav masthead__nav--zh">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">首页</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ link.url | replace: '/#', '#' }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="masthead__nav masthead__nav--en">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#en-about-me">Home</a></li>
          {% for link in site.data.navigation-en.main %}
            <li class="masthead__menu-item"><a href="{{ link.url | replace: '/#', '#' }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <div class="masthead__lang-switch" role="group" aria-label="Language">
      <button type="button" class="masthead__lang-btn masthead__lang-btn--active" data-lang="zh" aria-pressed="true">中文</button>
      <span class="masthead__lang-divider" aria-hidden="true">|</span>
      <button type="button" class="masthead__lang-btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</div>
